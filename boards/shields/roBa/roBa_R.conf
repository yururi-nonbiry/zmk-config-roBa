CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y



CONFIG_I2C=y
CONFIG_INPUT=y

CONFIG_INPUT_AZOTEQ_IQS5XX=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 

# RGB LED Widget
CONFIG_RGBLED_WIDGET=y

# RGB LED Widget - Layer Settings
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5
# Layer 6 = LEFT_HAND（CLIP STUDIO: 拡大縮小モード）: 3 = 黄
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=3
# Layer 7 = LH_ROTATE（CLIP STUDIO: 回転モード）: 6 = 水色
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=6
# Layer 8 = LH_BRUSH（CLIP STUDIO: ブラシサイズモード）: 5 = マゼンタ
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=5

